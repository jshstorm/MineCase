version: '3'

services:
  minecase.persistdb:
    image: "mongo:8.0"

  minecase.server:
    image: "sunnycase/minecase.server:ci-latest-nanoserver"
    depends_on:
      - minecase.persistdb

  minecase.gateway:
    image: "sunnycase/minecase.gateway:ci-latest-nanoserver"
    ports:
      - "25565:25565"
    depends_on:
      - minecase.server